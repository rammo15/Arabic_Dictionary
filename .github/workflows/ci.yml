name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: |
          pip install -e .
          pip install pytest pytest-cov ruff black mypy

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy src

      - name: Run Tests
        run: pytest