[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-dictionary"
version = "0.1.0a1"
description = "A modern open-source Arabic dictionary toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
    {name = "Rami Sulaimani"}
]

dependencies = [
    "requests>=2.32",
    "mwparserfromhell>=0.7",
    "openpyxl>=3.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

files = [
    "src/arabic_dictionary/domain",
    "tests",
]
